<div class="container mt-4">

    <div class="card p-4 shadow">

        <h2 class="mb-4">Agregar película</h2>

        <input type="text" class="form-control mb-3" placeholder="Título" [(ngModel)]="movie.title">

        <textarea class="form-control mb-3" placeholder="Sinopsis" [(ngModel)]="movie.synopsis">
    </textarea>

        <input type="number" class="form-control mb-3" placeholder="Año" [(ngModel)]="movie.year">

        <input type="text" class="form-control mb-3" placeholder="Imagen" [(ngModel)]="movie.cover">

        <button class="btn btn-primary" (click)="saveMovie()">

            Guardar película

        </button>

    </div>

</div>
